# Postgres settings for a LegalMemory index of ~50,000 documents.
#
# Sized from a measured 13,544-document index: 9.1 GB of database, of which the
# `chunks` table is 7.3 GB and almost all of that is pgvector embeddings at 1536
# dimensions. That is ~55 chunks per document and ~670 KB of database per
# document, so 50,000 documents is roughly:
#
#   chunks       ~2.7 M rows      database  ~34 GB
#   artifacts    ~2.5 GB on disk  OpenSearch ~18 GB
#
# Assumes a 32 GB host. Every number below is a fraction of that; on a different
# machine they scale together and should not be edited one at a time.
#
# This file is passed as `config_file`, not included from another one: `include`
# is a config-file directive and Postgres rejects it as a `-c` flag, which it
# does by refusing to start. Everything not named here keeps its built-in
# default, so the file only has to carry what differs.

# ------------------------------------------------------------------ listening
# The one setting that is not tuning. It defaults to localhost, and a container
# listening on localhost is a container nothing else in the network can reach —
# the image normally sets this in the config file this one replaces.
listen_addresses = '*'

# ----------------------------------------------------------------- companions
# `hba_file` and `ident_file` default to the directory holding *this* file, not
# to the data directory. Left implicit they resolve to /etc/postgresql, where
# only this file is mounted, and Postgres starts with no host rules at all: it
# accepts the local socket the healthcheck uses, reports itself healthy, and
# refuses every connection over the network with "no pg_hba.conf entry".
hba_file = '/var/lib/postgresql/data/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'

# ------------------------------------------------------------------- memory
# A quarter of RAM, the long-standing default ratio. The working set is chunk
# rows being written and matter/document rows being read; neither benefits from
# starving the page cache to buy more here.
shared_buffers = 8GB

# What the planner believes the OS will cache. Not an allocation — set it high
# or the planner picks sequential scans over index scans on the big tables.
effective_cache_size = 24GB

# Per sort/hash node, not per connection, so the real ceiling is this times the
# number of concurrent nodes. Deliberately modest: the tree's GROUP BY on path
# segments is the heaviest planned sort and it is nowhere near this.
work_mem = 64MB

# Index builds and VACUUM. The restore of a 34 GB dump rebuilds every index at
# the end, and this is the single setting that decides how long that takes.
maintenance_work_mem = 2GB

# ---------------------------------------------------------------------- wal
# Bulk insertion — a pipeline run or a restore — is one long write. A small
# max_wal_size forces a checkpoint every few seconds and turns a sequential
# write into a stall; these let a checkpoint span minutes of ingest instead.
max_wal_size = 8GB
min_wal_size = 2GB
checkpoint_timeout = 15min
# Spread the checkpoint write over most of the interval rather than dumping it.
checkpoint_completion_target = 0.9
wal_compression = on

# ------------------------------------------------------------------ storage
# SSD: random reads cost about the same as sequential ones, and the 4.0 default
# is a spinning-disk assumption that pushes the planner away from index scans.
random_page_cost = 1.1
effective_io_concurrency = 200

# ------------------------------------------------------------------- vacuum
# 2.7 M chunk rows arriving in bulk. The scale-factor defaults (20% of the
# table) mean autovacuum would wait for half a million dead rows before acting;
# the thresholds below make it act on a fixed count instead, which is what keeps
# a bulk load from ending with a table that needs a manual VACUUM to be usable.
autovacuum_vacuum_scale_factor = 0.02
autovacuum_analyze_scale_factor = 0.01
autovacuum_vacuum_cost_limit = 2000
autovacuum_max_workers = 4
# Fresh statistics matter more than usual here: the planner's choices on the
# chunks table swing on whether it believes there are 10k rows or 2.7 M.
default_statistics_target = 200

# -------------------------------------------------------------- connections
# The appliance, the worker and the demo each hold a pool. This is generous for
# three clients and cheap; the memory ceiling is work_mem, set above.
max_connections = 200

# --------------------------------------------------------------- visibility
# A query that takes longer than this is worth seeing in the log. At this size
# the interesting ones are the tree aggregate and anything touching chunks.
log_min_duration_statement = 2000
log_checkpoints = on
log_autovacuum_min_duration = 10000
