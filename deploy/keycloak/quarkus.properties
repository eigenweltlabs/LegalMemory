# Header limits, raised at BUILD time — the only time Quarkus reads them. KC_*, QUARKUS_*
# and JAVA_OPTS_APPEND are silently ignored at runtime.
#
# Why: every app a developer runs on localhost shares one cookie jar (cookies ignore the
# port), so requests reach Keycloak carrying every other local app's cookies and exceed
# the 8KB default, surfacing as HTTP 431.
#
# Both are needed and they are different protocols' limits: HTTP/1.1 obeys
# max-header-size, HTTP/2 obeys its own SETTINGS_MAX_HEADER_LIST_SIZE.
#
# Do NOT "fix" h2 by setting quarkus.http.http2=false — that breaks ALPN and Keycloak
# then resets every TLS connection, including ones carrying no cookies. Verified.
quarkus.http.limits.max-header-size=65536
quarkus.http.limits.max-header-list-size=65536
